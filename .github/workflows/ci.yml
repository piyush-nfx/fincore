# Runs every test (unit + Testcontainers integration tests) on each push and pull request, then checks the Docker
# image still builds. GitHub's Ubuntu runners have Docker, so Testcontainers can start MySQL there too.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        run: ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t fincore:ci .
