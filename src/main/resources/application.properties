spring.application.name=fincore
# Hosting platforms (Railway, Render, ...) tell the app which port to use through the PORT variable.
server.port=${PORT:8083}

# db configuration
# Secrets are never committed. Local values live in the git-ignored .env file in the project root
# (copy .env.example to .env); on a server they come from real environment variables.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fincore?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks at startup that the
# entities still match the tables, and refuses to start if they don't; it never changes the schema itself.
spring.jpa.hibernate.ddl-auto=validate
# A database whose tables were created before Flyway (by ddl-auto=update) is recorded as version 1
# instead of re-running V1; later migrations then run normally. An empty database simply runs V1, V2, ...
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Keep DB access inside the service layer's transactions (no lazy loading in controllers).
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT: the signing secret must be a Base64 string of at least 32 bytes (64 recommended).
fincore.jwt.secret=${JWT_SECRET}
# Short-lived access token limits the damage if one leaks; the refresh token gets a new one.
fincore.jwt.access-token-ttl=15m
fincore.jwt.refresh-token-ttl=7d

# Optional: creates an ADMIN account at startup if both are set and the email is not registered yet.
fincore.admin.email=${ADMIN_EMAIL:}
fincore.admin.password=${ADMIN_PASSWORD:}

# Users log in through our own JWT endpoints, so Spring Boot's default in-memory user (and the
# "generated security password" it prints) is not needed.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# API docs (/v3/api-docs, /swagger-ui.html) are deliberately public: the live Swagger link is part of the project.
# Set both to false for a deployment where the docs should be hidden.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Show endpoints grouped by tag and sorted, and keep the pasted token across page reloads.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true

# Clients can't ask for huge pages and overload the database.
spring.data.web.pageable.max-page-size=100
