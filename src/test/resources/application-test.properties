# Test profile: everything a test needs is here, so tests also run on a machine (or CI server) without a .env file.
# The datasource comes from the Testcontainers MySQL (see TestcontainersConfiguration).

# A fixed, test-only signing key (64 zero bytes, Base64). Never used outside tests.
fincore.jwt.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
fincore.admin.email=
fincore.admin.password=

# The concurrency tests run 10+ transfers at once, and a transfer that fails briefly needs a second connection
# for its FAILED ledger row (REQUIRES_NEW). A pool larger than the number of test threads avoids starving it.
spring.datasource.hikari.maximum-pool-size=30
